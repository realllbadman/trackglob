# /etc/nginx/sites-available/parcel-tracking
# After enabling, run:  sudo certbot --nginx -d globaltransiting.com -d www.globaltransiting.com
server {
    listen 80;
    listen [::]:80;
    server_name globaltransiting.com www.globaltransiting.com;

    client_max_body_size 10M;

    location /static/ {
        alias /opt/parcel-tracking/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
